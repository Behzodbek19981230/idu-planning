# /etc/nginx/sites-available/idu-schedule.conf
# SSL sertifikatlarni certbot o'zi qo'shadi: certbot --nginx -d idu-schedule.universal-uz.uz -d api.idu-schedule.universal-uz.uz

# ---------- Backend API ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.idu-schedule.universal-uz.uz;

    # Excel import fayli (10 MB gacha)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4010;  # server/.env dagi PORT bilan bir xil
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------- Frontend (React build) ----------
server {
    listen 80;
    listen [::]:80;
    server_name idu-schedule.universal-uz.uz;

    root /var/www/idu-planning/client/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fayl nomlarida hash bor — uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: barcha yo'llar index.html ga
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
